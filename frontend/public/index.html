        <!-- Service-worker killer: unregisters any stale service workers from a
             previous deployment of this domain and purges their caches so
             returning visitors automatically receive the current build. -->
        <script>
            (function () {
                if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
                    navigator.serviceWorker
                        .getRegistrations()
                        .then(function (regs) {
                            regs.forEach(function (r) {
                                r.unregister();
                            });
                        })
                        .catch(function () {});
                }
                if (typeof caches !== "undefined" && caches.keys) {
                    caches
                        .keys()
                        .then(function (keys) {
                            keys.forEach(function (k) {
                                caches.delete(k);
                            });
                        })
                        .catch(function () {});
                }
            })();
        </script>
